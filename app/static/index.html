<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chatter Radar</title>
  <meta name="theme-color" content="#14241A">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <svg viewBox="0 0 100 100"><path d="M13.76 34.58A38.0 38.0 0 0 1 56.19 16.13 M34.63 88.93A38.0 38.0 0 0 1 11.07 40.63 M79.91 34.00A38.0 38.0 0 0 1 43.03 90.79 M69.08 61.04A23.5 23.5 0 1 1 49.05 29.59" fill="none" stroke="#2ECC64" stroke-width="7.4" stroke-linecap="round"/><path d="M50.00 45.00L81.50 16.50" fill="none" stroke="#2ECC64" stroke-width="7.4" stroke-linecap="round"/><circle cx="54.50" cy="60.00" r="4.7" fill="#2ECC64"/></svg>
        <span class="wordmark"><span class="lite">Chatter</span> Radar</span>
      </div>
      <nav class="tabs" id="tabs">
        <button data-tab="tasks">Tasks <span class="count" id="open-count" hidden></span></button>
        <button data-tab="messages">Messages</button>
        <button data-tab="assistant">Assistant <span class="count warn" id="proposal-count" hidden></span></button>
        <button data-tab="sources">Sources</button>
        <button data-tab="settings">Pipeline</button>
      </nav>
    </div>
  </header>
  <main id="view"></main>
  <footer id="credit" class="credit" hidden></footer>
  <div id="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
